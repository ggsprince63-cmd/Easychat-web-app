<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sender Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
        }
        /* Custom scrollbar for a cleaner look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col text-gray-900 overflow-hidden relative">

    <header class="w-full flex justify-between items-center px-8 py-6 border-b border-gray-100 z-10">
        <!-- Left spacer to perfectly center the title -->
        <div class="w-1/3 flex justify-start">
            <div class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box" viewBox="0 0 16 16">
                  <path d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5 8 5.961 14.154 3.5zM15 4.239l-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"/>
                </svg>
            </div>
        </div>

        <!-- Center Title -->
        <div class="w-1/3 flex justify-center">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-gray-800 text-center">
                Enjoy up to 25% more.
            </h1>
        </div>

        <!-- Right Balance Display -->
        <div class="w-1/3 flex justify-end">
            <div class="bg-gray-50 px-4 py-2 rounded-xl border border-gray-100 shadow-sm">
                <span class="text-sm text-gray-500 font-medium mr-1">Balance:</span>
                <span id="balance-display" class="text-xl font-bold text-gray-900 tracking-tight">800,000</span>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center relative">
        <!-- Minimal decorative element -->
        <div class="absolute inset-0 flex items-center justify-center opacity-5 pointer-events-none">
            <svg width="400" height="400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
        </div>
        
        <div class="text-center z-10 px-4">
            <h2 class="text-4xl font-extrabold text-gray-200 mb-4">Ready to send?</h2>
            <p class="text-gray-400">Your secure dashboard is ready.</p>
        </div>
    </main>

    <footer class="w-full pb-12 pt-6 flex justify-center z-10 bg-gradient-to-t from-white to-transparent">
        <button id="open-modal-btn" class="group relative inline-flex items-center justify-center px-10 py-5 text-lg font-semibold text-white transition-all duration-200 bg-gray-900 border border-transparent rounded-full shadow-lg hover:bg-gray-800 hover:shadow-xl hover:-translate-y-1 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900 w-64">
            Send Now
            <svg class="w-5 h-5 ml-2 transition-transform duration-200 group-hover:translate-x-1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
        </button>
    </footer>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-40 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        
        <!-- Modal Card -->
        <div id="modal-card" class="bg-white rounded-3xl shadow-2xl w-full max-w-md transform scale-95 transition-transform duration-300 overflow-hidden">
            <!-- Modal Header -->
            <div class="px-8 py-6 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="text-xl font-bold text-gray-900">Send Funds</h3>
                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-600 transition-colors p-1 rounded-full hover:bg-gray-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-8 space-y-6">
                <!-- Username Input -->
                <div class="space-y-2">
                    <label for="username" class="block text-sm font-semibold text-gray-700">Recipient Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-gray-500 font-medium">@</span>
                        </div>
                        <input type="text" id="username" class="block w-full pl-8 pr-4 py-3 border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-900 focus:border-transparent transition-all outline-none text-gray-800 bg-gray-50 focus:bg-white" placeholder="username">
                    </div>
                    <p id="username-error" class="text-red-500 text-xs hidden mt-1">Please enter a valid username.</p>
                </div>

                <!-- Price Selection -->
                <div class="space-y-3">
                    <label class="block text-sm font-semibold text-gray-700">Select Amount</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="price" value="5" class="peer sr-only" checked>
                            <div class="rounded-xl border border-gray-200 px-4 py-3 hover:bg-gray-50 peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white transition-all text-center font-medium text-gray-700">
                                5
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="price" value="100" class="peer sr-only">
                            <div class="rounded-xl border border-gray-200 px-4 py-3 hover:bg-gray-50 peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white transition-all text-center font-medium text-gray-700">
                                100
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="price" value="1000" class="peer sr-only">
                            <div class="rounded-xl border border-gray-200 px-4 py-3 hover:bg-gray-50 peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white transition-all text-center font-medium text-gray-700">
                                1000
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="price" value="10000" class="peer sr-only">
                            <div class="rounded-xl border border-gray-200 px-4 py-3 hover:bg-gray-50 peer-checked:border-gray-900 peer-checked:bg-gray-900 peer-checked:text-white transition-all text-center font-medium text-gray-700">
                                10000
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Modal Footer -->
            <div class="px-8 py-6 bg-gray-50 border-t border-gray-100 flex gap-3">
                <button id="cancel-btn" class="flex-1 px-4 py-3 text-gray-700 bg-white border border-gray-200 rounded-xl hover:bg-gray-50 font-medium transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200">
                    Cancel
                </button>
                <button id="confirm-btn" class="flex-1 px-4 py-3 text-white bg-gray-900 rounded-xl hover:bg-gray-800 font-medium transition-colors shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-900">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Alert / Toast (replaces default window.alert) -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none flex items-center p-4 mb-4 text-gray-800 bg-white border border-gray-100 rounded-2xl shadow-xl max-w-sm">
        <div class="inline-flex items-center justify-center flex-shrink-0 w-10 h-10 text-green-500 bg-green-100 rounded-full">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
        </div>
        <div class="ml-4 text-sm font-normal">
            <span class="block font-bold text-gray-900 text-base" id="toast-title">Success</span>
            <span id="toast-message" class="text-gray-500">Transaction completed.</span>
        </div>
    </div>

    <script>
        // State
        let balance = 800000;

        // DOM Elements
        const balanceDisplay = document.getElementById('balance-display');
        const openModalBtn = document.getElementById('open-modal-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const confirmBtn = document.getElementById('confirm-btn');
        const modalOverlay = document.getElementById('modal-overlay');
        const modalCard = document.getElementById('modal-card');
        const usernameInput = document.getElementById('username');
        const usernameError = document.getElementById('username-error');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toast-message');

        // Initialize display
        function updateBalanceDisplay() {
            balanceDisplay.textContent = balance.toLocaleString();
        }
        updateBalanceDisplay();

        // Modal Functions
        function openModal() {
            modalOverlay.classList.remove('hidden');
            // Slight delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modalOverlay.classList.remove('opacity-0');
                modalCard.classList.remove('scale-95');
                modalCard.classList.add('scale-100');
            }, 10);
            
            // Reset fields
            usernameInput.value = '';
            usernameError.classList.add('hidden');
            usernameInput.focus();
        }

        function closeModal() {
            modalOverlay.classList.add('opacity-0');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-95');
            
            // Wait for transition to finish before hiding
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
            }, 300);
        }

        // Toast Functions
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 4000);
        }

        // Event Listeners
        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelBtn.addEventListener('click', closeModal);

        // Close modal when clicking outside the card
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Handle Confirmation
        confirmBtn.addEventListener('click', () => {
            const username = usernameInput.value.trim();
            const selectedPriceElement = document.querySelector('input[name="price"]:checked');
            
            // Validation
            if (!username) {
                usernameError.classList.remove('hidden');
                usernameInput.classList.add('border-red-300', 'focus:ring-red-500');
                return;
            } else {
                usernameError.classList.add('hidden');
                usernameInput.classList.remove('border-red-300', 'focus:ring-red-500');
            }

            if (!selectedPriceElement) return;

            const amount = parseInt(selectedPriceElement.value, 10);

            // Check sufficient balance
            if (amount > balance) {
                showToast("Insufficient balance.");
                return;
            }

            // Process transaction
            balance -= amount;
            updateBalanceDisplay();
            closeModal();
            
            // Show custom success message
            showToast(`Sent ${amount.toLocaleString()} to @${username}.`);
        });

        // Remove error styling on input typing
        usernameInput.addEventListener('input', () => {
            if (usernameInput.value.trim().length > 0) {
                usernameError.classList.add('hidden');
                usernameInput.classList.remove('border-red-300', 'focus:ring-red-500');
            }
        });
    </script>
</body>
</html>
